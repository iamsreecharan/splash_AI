name: Splash V1 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test -- --run

  local-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cp .env.example .env && mkdir -p .secrets
      - run: docker compose up --build -d --wait
      - run: python scripts/smoke.py --verify-deletion
      - run: npm ci && npx playwright install --with-deps chromium && npm test
        working-directory: tests/e2e
      - if: failure()
        run: docker compose logs --tail=150
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-results
          path: |
            .splash/smoke-results.json
            tests/e2e/test-results/
      - if: always()
        run: docker compose down -v
